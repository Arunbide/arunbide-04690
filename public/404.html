<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages does not provide an SPA rewrite rule. Preserve the path
      // and send it to index.html, where the app restores it before mounting.
      (() => {
        const projectPath = "/arunbide-04690";
        const isGitHubProjectPage = /(^|\.)github\.io$/.test(window.location.hostname);
        const base = isGitHubProjectPage ? projectPath : "";
        const path = window.location.pathname.startsWith(base)
          ? window.location.pathname.slice(base.length) || "/"
          : window.location.pathname;
        const requestedUrl = `${path}${window.location.search}${window.location.hash}`;

        window.location.replace(`${base}/?redirect=${encodeURIComponent(requestedUrl)}`);
      })();
    </script>
  </head>
  <body></body>
</html>
